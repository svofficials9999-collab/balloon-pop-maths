5:["జ్ఞానపీఠ్ పురస్కారం పొందిన తొలి తెలుగు రచయిత ఎవరు?|విశ్వనాథ సత్యనారాయణ|సి. నారాయణరెడ్డి|శ్రీశ్రీ|గురజాడ","సి. నారాయణరెడ్డికి జ్ఞానపీఠ్ తెచ్చిన రచన ఏది?|విశ్వంభర|మహాప్రస్థానం|వేయి పడగలు|కన్యాశుల్కం","'కవిసార్వభౌముడు' అని ఎవరిని పిలుస్తారు?|శ్రీనాథుడు|పోతన|నన్నయ|తిక్కన","అష్టదిగ్గజ కవులు ఏ రాజు ఆస్థానంలో ఉండేవారు?|శ్రీకృష్ణదేవరాయలు|కాకతీయ గణపతిదేవుడు|శాతవాహనులు|కులీ కుతుబ్ షా","పోతన భాగవతాన్ని ఎవరికి అంకితం ఇచ్చాడు?|శ్రీరామునికి|రాజుకు|వేంకటేశ్వరునికి|శివునికి","తెలంగాణ భాషా దినోత్సవం ఏ రోజు (కాళోజీ జయంతి)?|సెప్టెంబర్ 9|ఆగస్టు 29|జనవరి 26|జూన్ 2","పదకవితా పితామహుడు ఎవరు?|అన్నమాచార్యుడు|క్షేత్రయ్య|త్యాగరాజు|రామదాసు","'మువ్వగోపాల' ముద్రతో పదాలు రాసినవారు ఎవరు?|క్షేత్రయ్య|అన్నమాచార్యుడు|త్యాగరాజు|పోతన","మహాభారతంలో ఎన్ని పర్వాలు ఉన్నాయి?|18|12|10|24","ఆంధ్ర కవితా పితామహుడు అని ఎవరిని అంటారు?|అల్లసాని పెద్దన|నన్నయ|తిక్కన|శ్రీనాథుడు"]

"GDP అంటే ఏమిటి?§What does GDP stand for?|స్థూల దేశీయోత్పత్తి~Gross Domestic Product|సాధారణ దేశ ధర~General Domestic Price|స్థూల అభివృద్ధి ప్రణాళిక~Gross Development Plan|ప్రభుత్వ ద్రవ్య ప్రణాళిక~Government Deficit Plan",

const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[rnd(0,a.length-1)];
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const gcd=(a,b)=>b?gcd(b,a%b):a;
const MI='\u2212';
const fmt=n=>n<0?MI+(-n):String(n);
function near(ans,neg){const set=new Set([ans]);const offs=shuf([1,-1,2,-2,3,-3,10,-10,5,-5,4,-4,6,-6,20,-20,9,11]);
 for(const o of offs){if(set.size>=4)break;const v=ans+o;if(!neg&&v<0)continue;set.add(v)}
 let k=1;while(set.size<4){set.add(ans+30+k++)}
 return [...set].filter(v=>v!==ans).slice(0,3).map(fmt)}
const T=(te,en)=>({te,en});
const same=s=>T(s,s);
function num(qs,ans,x,neg){return {q:typeof qs==='string'?same(qs):qs,a:fmt(ans),w:near(ans,neg),x}}
function ex(expr,ans,neg){return num(expr+' = ?',ans,expr,neg)}
function choose(q,ans,others){return {q,a:String(ans),w:others.map(String)}}
// generators
const GN={
add:m=>{const a=rnd(1,m),b=rnd(1,m);return ex(`${a} + ${b}`,a+b)},
sub:m=>{const a=rnd(2,m),b=rnd(1,a);return ex(`${a} ${MI} ${b}`,a-b)},
mul:(m,n)=>{const a=rnd(2,m),b=rnd(2,n||10);return ex(`${a} \u00D7 ${b}`,a*b)},
div:(m,n)=>{const b=rnd(2,m),c=rnd(2,n||10);return ex(`${b*c} \u00F7 ${b}`,c)},
missing:m=>{const a=rnd(1,m),b=rnd(1,m);return num(`${a} + ? = ${a+b}`,b,`${a} + ${b} = ${a+b}`)},
big:()=>{const s=new Set();while(s.size<4)s.add(rnd(1,99));const a=[...s];const m=Math.max(...a);return choose(T('ఈ సంఖ్యలలో అతి పెద్దది ఏది?','Which is the biggest number?'),m,a.filter(v=>v!==m))},
small:()=>{const s=new Set();while(s.size<4)s.add(rnd(1,99));const a=[...s];const m=Math.min(...a);return choose(T('ఈ సంఖ్యలలో అతి చిన్నది ఏది?','Which is the smallest number?'),m,a.filter(v=>v!==m))},
even:m=>{const e=rnd(1,m)*2;const o=new Set();while(o.size<3)o.add(rnd(0,m)*2+1);return choose(T('సరి సంఖ్య ఏది?','Which number is even?'),e,[...o])},
odd:m=>{const e=rnd(0,m)*2+1;const o=new Set();while(o.size<3)o.add(rnd(1,m)*2);return choose(T('బేసి సంఖ్య ఏది?','Which number is odd?'),e,[...o])},
skip:()=>{const d=pick([2,5,10,3,4]);const s=rnd(1,5)*d;const seq=[s,s+d,s+2*d];return num(T(`${seq.join(', ')}, ? (+${d})`,`${seq.join(', ')}, ? (+${d})`),s+3*d,null)},
round10:()=>{let n;do{n=rnd(11,999)}while(n%10===5||n%10===0);return num(T(`${n} ను దగ్గరి 10 కి మార్చండి`,`Round ${n} to the nearest 10`),Math.round(n/10)*10,null)},
round100:()=>{let n;do{n=rnd(101,9999)}while(n%100===50||n%100===0);return num(T(`${n} ను దగ్గరి 100 కి మార్చండి`,`Round ${n} to the nearest 100`),Math.round(n/100)*100,null)},
rectP:()=>{const l=rnd(3,20),w=rnd(2,l);return num(T(`దీర్ఘచతురస్రం పొడవు ${l}, వెడల్పు ${w}. చుట్టుకొలత ఎంత?`,`A rectangle is ${l} long and ${w} wide. What is its perimeter?`),2*(l+w),null)},
rectA:()=>{const l=rnd(3,15),w=rnd(2,12);return num(T(`దీర్ఘచతురస్రం పొడవు ${l}, వెడల్పు ${w}. వైశాల్యం ఎంత?`,`A rectangle is ${l} long and ${w} wide. What is its area?`),l*w,null)},
sqA:()=>{const s=rnd(2,15);return num(T(`చతురస్ర భుజం ${s}. వైశాల్యం ఎంత?`,`A square has side ${s}. What is its area?`),s*s,null)},
frac:()=>{const d=pick([2,3,4,5,10]);const n=rnd(1,d-1);const k=rnd(2,10);return num(T(`${k*d} లో ${n}/${d} వంతు`,`${n}/${d} of ${k*d}`),n*k,null)},
pct:()=>{const p=pick([10,20,25,50,75]);const b=pick([20,40,60,80,100,120,200,400]);return num(T(`${b} లో ${p}%`,`${p}% of ${b}`),p*b/100,null)},
hcf:()=>{const g=rnd(2,9),a=rnd(2,6),b=rnd(2,6);if(a===b||gcd(a,b)!==1)return GN.hcf();return num(T(`${g*a}, ${g*b} ల గ.సా.భా (HCF)`,`HCF of ${g*a} and ${g*b}`),g,null)},
lcm:()=>{const a=rnd(2,12),b=rnd(2,12);if(a===b)return GN.lcm();return num(T(`${a}, ${b} ల క.సా.గు (LCM)`,`LCM of ${a} and ${b}`),a*b/gcd(a,b),null)},
sq:m=>{const a=rnd(2,m);return num(`${a}\u00B2 = ?`,a*a,T(`${a} స్క్వేర్`,`${a} squared`))},
cube:m=>{const a=rnd(2,m);return num(`${a}\u00B3 = ?`,a*a*a,T(`${a} క్యూబ్`,`${a} cubed`))},
sqrt:m=>{const a=rnd(2,m);return num(`\u221A${a*a} = ?`,a,T(`${a*a} వర్గమూలం`,`square root of ${a*a}`))},
cbrt:()=>{const a=rnd(2,10);return num(`\u221B${a*a*a} = ?`,a,T(`${a*a*a} ఘనమూలం`,`cube root of ${a*a*a}`))},
bodmas:()=>{const a=rnd(2,9),b=rnd(2,9),c=rnd(2,9);return ex(`${a} + ${b} \u00D7 ${c}`,a+b*c)},
bodmas2:()=>{const a=rnd(2,9),b=rnd(2,9),c=rnd(2,9);return ex(`(${a} + ${b}) \u00D7 ${c}`,(a+b)*c)},
ratio:()=>{const g=rnd(2,9),a=rnd(1,6),b=rnd(1,6);if(a===b||gcd(a,b)!==1)return GN.ratio();return {q:same(`${g*a} : ${g*b} = ?`),a:`${a} : ${b}`,w:shuf([`${b} : ${a}`,`${a+1} : ${b}`,`${a} : ${b+1}`,`${g*a} : ${b}`].filter(s=>s!==`${a} : ${b}`)).slice(0,3),x:null}},
intadd:()=>{const a=rnd(-15,15),b=rnd(-15,15);const s=a<0?`(${fmt(a)})`:`${a}`;const t=b<0?`(${fmt(b)})`:`${b}`;return ex(`${s} + ${t}`,a+b,true)},
intmul:()=>{const a=rnd(-9,9)||2,b=rnd(2,9)*(Math.random()<.5?-1:1);return ex(`(${fmt(a)}) \u00D7 (${fmt(b)})`,a*b,true)},
eq1:()=>{const x=rnd(1,15),a=rnd(2,9),b=rnd(1,20);return num(T(`${a}x + ${b} = ${a*x+b} అయితే x = ?`,`If ${a}x + ${b} = ${a*x+b}, then x = ?`),x,null)},
eq2:()=>{const x=rnd(-8,12),a=rnd(2,9),b=rnd(1,20);return num(T(`${a}x ${MI} ${b} = ${a*x-b} అయితే x = ?`,`If ${a}x ${MI} ${b} = ${a*x-b}, then x = ?`),x,null,true)},
si:()=>{const P=pick([1000,2000,5000,1500,2500]),R=pick([5,10,4,8]),t=rnd(1,5);return num(T(`అసలు ₹${P}, రేటు ${R}%, కాలం ${t} సం. సాధారణ వడ్డీ ఎంత?`,`Principal \u20B9${P}, rate ${R}%, time ${t} years. Simple interest = ?`),P*R*t/100,null)},
circA:()=>{const r=pick([7,14,21]);return num(T(`వ్యాసార్థం ${r} ఉన్న వృత్త వైశాల్యం (\u03C0=22/7)`,`Area of a circle with radius ${r} (\u03C0=22/7)`),22*r*r/7,null)},
circC:()=>{const r=pick([7,14,21]);return num(T(`వ్యాసార్థం ${r} ఉన్న వృత్త చుట్టుకొలత (\u03C0=22/7)`,`Circumference of a circle with radius ${r} (\u03C0=22/7)`),44*r/7,null)},
triA:()=>{const b=rnd(2,12)*2,h=rnd(2,12);return num(T(`త్రిభుజ భూమి ${b}, ఎత్తు ${h}. వైశాల్యం ఎంత?`,`A triangle has base ${b} and height ${h}. Area = ?`),b*h/2,null)},
speed:()=>{const s=rnd(2,12)*5,t=rnd(2,6);return num(T(`వేగం ${s} కి.మీ/గం, ${t} గంటల్లో దూరం ఎంత (కి.మీ)?`,`Speed ${s} km/h for ${t} hours. Distance (km) = ?`),s*t,null)},
pow:()=>{const b=pick([2,3,4,5,10]);const e=b===2?rnd(2,8):b===10?rnd(2,4):rnd(2,4);return num(`${b}^${e} = ?`,Math.pow(b,e),T(`${b} పవర్ ${e}`,`${b} to the power ${e}`))},
sqdiff:()=>{const a=rnd(6,20),b=rnd(2,a-1);return num(T(`${a}\u00B2 ${MI} ${b}\u00B2 = ?`,`${a}\u00B2 ${MI} ${b}\u00B2 = ?`),a*a-b*b,null)},
polyv:()=>{const x=rnd(1,6),a=rnd(1,4),b=rnd(1,6),c=rnd(1,9);return num(T(`${a}x\u00B2 + ${b}x + ${c} లో x = ${x} అయితే విలువ?`,`Value of ${a}x\u00B2 + ${b}x + ${c} when x = ${x}`),a*x*x+b*x+c,null)},
zero:()=>{const a=rnd(2,9),r=rnd(1,12);return num(T(`${a}x ${MI} ${a*r} బహుపది శూన్యం (zero) ఎంత?`,`Zero of the polynomial ${a}x ${MI} ${a*r}`),r,null)},
pyth:()=>{const t=pick([[3,4,5],[5,12,13],[8,15,17],[7,24,25],[6,8,10],[9,12,15],[20,21,29]]);return num(T(`లంబకోణ త్రిభుజంలో భుజాలు ${t[0]}, ${t[1]}. కర్ణం ఎంత?`,`A right triangle has sides ${t[0]} and ${t[1]}. Hypotenuse = ?`),t[2],null)},
angle3:()=>{const a=rnd(30,80),b=rnd(30,80);return num(T(`త్రిభుజంలో రెండు కోణాలు ${a}\u00B0, ${b}\u00B0. మూడవ కోణం ఎంత?`,`Two angles of a triangle are ${a}\u00B0 and ${b}\u00B0. The third angle = ?`),180-a-b,null)},
poly:()=>{const n=pick([5,6,8,10,12]);return num(T(`${n} భుజాల సమబహుభుజి అంతర కోణాల మొత్తం ఎంత (డిగ్రీలు)?`,`Sum of interior angles of a polygon with ${n} sides (degrees)?`),(n-2)*180,null)},
mean:()=>{const n=5,m=rnd(5,40);const a=[];let s=0;for(let i=0;i<n-1;i++){const v=rnd(m-4,m+4);a.push(v);s+=v}a.push(m*n-s);return num(T(`${a.join(', ')} ల సగటు ఎంత?`,`Mean of ${a.join(', ')}`),m,null)},
ap:()=>{const a=rnd(1,10),d=rnd(2,7),n=rnd(8,15);return num(T(`${a}, ${a+d}, ${a+2*d}, ... శ్రేణిలో ${n}వ పదం ఎంత?`,`${a}, ${a+d}, ${a+2*d}, ... Find the ${n}th term`),a+(n-1)*d,null)},
apsum:()=>{const n=rnd(5,25);return num(T(`మొదటి ${n} సహజ సంఖ్యల మొత్తం ఎంత?`,`Sum of the first ${n} natural numbers`),n*(n+1)/2,null)},
quad:()=>{let p=rnd(1,9),q=rnd(1,9);if(p===q)q=p+1;const hi=Math.max(p,q),lo=Math.min(p,q);return num(T(`x\u00B2 ${MI} ${p+q}x + ${p*q} = 0 యొక్క పెద్ద మూలం ఎంత?`,`The larger root of x\u00B2 ${MI} ${p+q}x + ${p*q} = 0`),hi,null)},
disc:()=>{const a=rnd(1,3),b=rnd(2,9),c=rnd(1,5);return num(T(`${a}x\u00B2 + ${b}x + ${c} = 0 యొక్క విచక్షణి (b\u00B2 ${MI} 4ac) ఎంత?`,`Discriminant (b\u00B2 ${MI} 4ac) of ${a}x\u00B2 + ${b}x + ${c} = 0`),b*b-4*a*c,null,true)},
dist:()=>{const t=pick([[3,4,5],[5,12,13],[6,8,10],[8,15,17]]);const x=rnd(0,5),y=rnd(0,5);return num(T(`(${x}, ${y}), (${x+t[0]}, ${y+t[1]}) బిందువుల మధ్య దూరం ఎంత?`,`Distance between (${x}, ${y}) and (${x+t[0]}, ${y+t[1]})`),t[2],null)},
cyl:()=>{const h=rnd(1,10);return num(T(`స్థూపం వ్యాసార్థం 7, ఎత్తు ${h}. ఘనపరిమాణం (\u03C0=22/7)`,`Volume of a cylinder: radius 7, height ${h} (\u03C0=22/7)`),154*h,null)},
prob:()=>{const r=rnd(1,6),b=rnd(1,6);const a=`${r}/${r+b}`;const o=[`${b}/${r+b}`,`${r}/${b}`,`1/${r+b}`,`${r+1}/${r+b}`].filter(s=>s!==a);return {q:T(`సంచిలో ${r} ఎరుపు, ${b} నీలం బంతులు ఉన్నాయి. ఎరుపు బంతి వచ్చే సంభావ్యత?`,`A bag has ${r} red and ${b} blue balls. P(red) = ?`),a,w:[...new Set(o)].slice(0,3),x:null,raw:1}},
trig:()=>{const t=[['sin 30\u00B0','1/2'],['cos 60\u00B0','1/2'],['sin 90\u00B0','1'],['cos 0\u00B0','1'],['tan 45\u00B0','1'],['sin 0\u00B0','0'],['cos 30\u00B0','\u221A3/2'],['tan 60\u00B0','\u221A3'],['sin 45\u00B0','1/\u221A2'],['cos 90\u00B0','0']];const c=pick(t);const vals=['0','1/2','1','\u221A3/2','\u221A3','1/\u221A2'].filter(v=>v!==c[1]);return {q:same(c[0]+' = ?'),a:c[1],w:shuf(vals).slice(0,3),x:null}},
mixcomp:()=>pick([GN.big,GN.small])(),
};
const POOL={
1:[()=>GN.add(9),()=>GN.sub(10),()=>GN.missing(9),()=>GN.big(),()=>GN.small(),()=>GN.even(9),()=>GN.odd(9)],
2:[()=>GN.add(40),()=>GN.sub(50),()=>GN.mul(5,5),()=>GN.skip(),()=>GN.even(40),()=>GN.odd(40),()=>GN.big(),()=>GN.missing(30)],
3:[()=>GN.add(300),()=>GN.sub(300),()=>GN.mul(10,10),()=>GN.div(10,10),()=>GN.round10(),()=>GN.small(),()=>GN.skip()],
4:[()=>GN.mul(12,12),()=>GN.div(12,12),()=>GN.add(900),()=>GN.sub(900),()=>GN.round100(),()=>GN.rectP(),()=>GN.rectA(),()=>GN.sqA()],
5:[()=>GN.frac(),()=>GN.hcf(),()=>GN.lcm(),()=>GN.sq(15),()=>GN.bodmas(),()=>GN.bodmas2(),()=>GN.pct(),()=>GN.mul(25,15)],
6:[()=>GN.intadd(),()=>GN.pct(),()=>GN.ratio(),()=>GN.hcf(),()=>GN.lcm(),()=>GN.sq(20),()=>GN.cube(6),()=>GN.triA(),()=>GN.eq1()],
7:[()=>GN.intadd(),()=>GN.intmul(),()=>GN.eq1(),()=>GN.sqrt(20),()=>GN.cbrt(),()=>GN.si(),()=>GN.circA(),()=>GN.circC(),()=>GN.pct(),()=>GN.pow()],
8:[()=>GN.eq1(),()=>GN.eq2(),()=>GN.sq(25),()=>GN.cube(10),()=>GN.sqrt(30),()=>GN.cbrt(),()=>GN.pow(),()=>GN.speed(),()=>GN.sqdiff(),()=>GN.si(),()=>GN.intmul()],
9:[()=>GN.polyv(),()=>GN.zero(),()=>GN.pyth(),()=>GN.angle3(),()=>GN.poly(),()=>GN.mean(),()=>GN.ap(),()=>GN.sqdiff(),()=>GN.eq2(),()=>GN.apsum()],
10:[()=>GN.quad(),()=>GN.disc(),()=>GN.ap(),()=>GN.apsum(),()=>GN.trig(),()=>GN.dist(),()=>GN.cyl(),()=>GN.prob(),()=>GN.pyth(),()=>GN.polyv()]
};

function showProgress(){const rows=Object.entries(progress.by).map(([k,v])=>{const bits=k.split('-');return `<li>${nm(SUBJ[bits[0]])} · ${t('cls')} ${bits[1]}: <b>${v.correct}/${v.answered}</b></li>`}).join('');const m=modal(`<h2>📊 ${word('నేర్చుకున్న ప్రోగ్రెస్','Learning progress')}</h2><p>${word('ఈ ఫోన్‌లో మాత్రమే సేవ్ అవుతుంది. పిల్లలు కలిసి వాడితే ఇది కలిపిన ప్రోగ్రెస్.','Saved only on this device. If children share it, these are combined results.')}</p><p>⭐ ${progress.stars} · ${progress.sessions} ${word('పూర్తయిన రౌండ్లు','finished rounds')} · ${progress.correct}/${progress.answered} ${word('సరైన సమాధానాలు','correct answers')}</p><div class="badge-row"><span class="badge">${progress.answered>=1?'🌱':'🔒'} ${word('మొదటి అడుగు','First step')}</span><span class="badge">${progress.correct>=10?'⭐':'🔒'} ${word('10 సరైనవి','10 correct')}</span><span class="badge">${progress.correct>=50?'🏅':'🔒'} ${word('50 సరైనవి','50 correct')}</span><span class="badge">${progress.days.length>=3?'🌻':'🔒'} ${word('3 రోజులు సాధన','3 practice days')}</span></div><ul>${rows||word('మొదటి రౌండ్ ప్రారంభించండి!','Start your first round!')}</ul><p class="hint">${word('ఇది సాధన కోసం. పూర్తి పాఠ్యపుస్తకం లేదా పరీక్ష కాదు. రోజూ చిన్న రౌండ్ ఆడి, తప్పు ప్రశ్నలు తిరిగి చూడండి. బ్రౌజర్ డేటా తొలగిస్తే ప్రోగ్రెస్ పోతుంది.','Practice, not a full textbook or an exam. Try a short round and revisit mistakes. Clearing browser data removes progress.')}</p><button class="play">${t('close')}</button>`);m.querySelector('button').onclick=()=>m.remove()}
const homeBeforeBn=home;home=function(){homeBeforeBn();const h=$('.home');if(!h||$('#bn-bar'))return;h.insertAdjacentHTML('beforeend',`<nav id="bn-bar" aria-label="Main"><button data-k="h"><i>🏠</i>${word('హోమ్','Home')}</button><button data-k="s"><i>📚</i>${word('సబ్జెక్టులు','Subjects')}</button><button data-k="l"><i>🚀</i>${word('నేర్చుకో','Learn')}</button><button data-k="p"><i>✍️</i>${word('ప్రాక్టీస్','Practice')}</button><button data-k="u"><i>👤</i>${word('ప్రొఫైల్','Profile')}</button></nav>`);$('#bn-bar').querySelectorAll('button').forEach(b=>b.onclick=()=>{const k=b.dataset.k;if(k==='h'){h.scrollTo?h.scrollTo({top:0,behavior:'smooth'}):0;window.scrollTo(0,0)}else if(k==='s'){const e=h.querySelector('.subjs');e&&e.scrollIntoView({behavior:'smooth',block:'center'})}else if(k==='l')openLearn();else if(k==='p')openLearn('#learn/exam');else openLearn('#learn/prog')})};
const homeBeforeSearch=home;home=function(){homeBeforeSearch();const b=$('#learn-btn');if(!b||$('#home-sq'))return;b.insertAdjacentHTML('afterend',`<div id="home-sw"><input id="home-sq" class="hq" type="search" autocomplete="off" placeholder="🔍 ${word('ఏ అంశమైనా వెతకండి…','Search any topic…')}"><div id="home-sr" class="lrn" style="background:none;width:92%;max-width:420px;margin:0 auto"></div></div>`);{const inp=$('#home-sq'),box=$('#home-sr');let tm=0;inp.addEventListener('focus',()=>{loadLearn().catch(()=>0)},{once:true});inp.oninput=()=>{clearTimeout(tm);const q=inp.value;tm=setTimeout(()=>{if(!q.trim()){box.innerHTML='';box.__q='';return}loadLearn().then(()=>window.LearnApp.inlineSearch(q,box,S.cls||5)).catch(()=>toast(word('ఒకసారి ఇంటర్నెట్ కావాలి.','Needs internet once.'),3000))},200)}}};
const PG=[["⏰", "రోజువారీ టైమ్‌టేబుల్", "Daily timetable (by age)", ["# 1–3 తరగతులు (సుమారు 6–8 ఏళ్లు)§Classes 1–3 (about 6–8 years)", "పాఠశాల తర్వాత చిన్న విశ్రాంతి, తరువాత 20–30 నిమిషాల ఆట ఆధారిత చదువు (అక్షరాలు, లెక్కలు, కథలు). మొత్తం ఇంటి చదువు 30–45 నిమిషాలు చాలు.§Short rest after school, then 20–30 minutes of play-based learning (letters, numbers, stories). 30–45 minutes of home study in total is enough.", "సాయంత్రం బయట ఆట, రాత్రి భోజనం తర్వాత కథ లేదా చదవడం, త్వరగా నిద్ర.§Outdoor play in the evening, a story or reading after dinner, early bedtime.", "# 4–7 తరగతులు (సుమారు 9–12 ఏళ్లు)§Classes 4–7 (about 9–12 years)", "ఉదయం 20 నిమిషాల రివిజన్, సాయంత్రం 1–1.5 గంటలు హోంవర్క్ + చదువు, 20–25 నిమిషాల తరువాత 5 నిమిషాల విరామం.§20 minutes of revision in the morning, 1–1.5 hours of homework and study in the evening, with a 5-minute break after every 20–25 minutes.", "వారానికి ఒకసారి అన్ని సబ్జెక్టులు కలిపి రివిజన్. ఆటలకు, హాబీలకు సమయం ఉంచండి.§Do one mixed revision of all subjects each week. Keep time for play and hobbies.", "# 8–10 తరగతులు (సుమారు 13–15 ఏళ్లు)§Classes 8–10 (about 13–15 years)", "సాయంత్రం 2–3 గంటలు చదువు (ఎక్కువగా కష్టమైన సబ్జెక్టు ముందు), 25–45 నిమిషాల తరువాత 5–10 నిమిషాల విరామం.§2–3 hours of study in the evening (hardest subject first), with a 5–10 minute break after every 25–45 minutes.", "పరీక్షలకు ముందు రోజువారీ ప్రణాళిక వేసుకోవాలి: ఈ రోజు ఏ అధ్యాయం, ఎన్ని ప్రశ్నలు.§Before exams, plan each day: which chapter, how many questions.", "# ఏ సమయం మంచిది?§Which time works best?", "చాలామంది పిల్లలు ఉదయం, విశ్రాంతి తరువాత బాగా ఏకాగ్రత పెట్టగలరు. కొత్త, కష్టమైన పాఠాలు ఆ సమయంలో చదవండి. ప్రతి ఒక్కరికి ఇది కొద్దిగా వేరుగా ఉంటుంది, మీ పిల్లకు ఏ సమయం సరిపోతుందో గమనించండి.§Many children focus best in the morning or after a rest. Put new, hard lessons there. It differs a little for each child, so watch which time suits yours.", "నిద్రకు ముందు చదివినదాన్ని 5 నిమిషాలు చూసుకుంటే మరుసటి రోజు గుర్తుండటానికి సహాయపడుతుంది.§A 5-minute look at what was studied just before sleep helps remembering the next day."]], ["🥗", "రోజువారీ ఆహారం", "Daily nutrition", ["# సమతుల్య ఆహారం§A balanced plate", "ప్రతి భోజనంలో ధాన్యాలు (అన్నం, రొట్టె, రాగి, జొన్న, సజ్జ), పప్పులు లేదా గుడ్లు/పాలు పదార్థాలు, కూరగాయలు ఉండాలి.§Each meal should have grains (rice, roti, ragi, jowar, bajra), pulses or eggs/dairy, and vegetables.", "రోజూ కనీసం ఒక పండు, ఆకుకూర లేదా కూరగాయలు ఎక్కువగా తినిపించండి. వేరుశనగ, పల్లీలు లాంటి గింజలు మంచి చిరుతిండి (అలర్జీ లేకపోతే).§Give at least one fruit daily and plenty of vegetables or leafy greens. Nuts such as groundnuts make a good snack (if there is no allergy).", "# ఉదయం, పాఠశాల§Morning and school", "ఉదయం అల్పాహారం మానకూడదు (ఇడ్లీ, ఉప్మా, రాగి జావ, గుడ్డు, పాలు). లంచ్ బాక్స్‌లో ఇంట్లో వండిన ఆహారం ఉంచండి.§Do not skip breakfast (idli, upma, ragi porridge, egg, milk). Pack home-cooked food in the lunch box.", "# తగ్గించవలసినవి§Limit these", "చిప్స్, బిస్కెట్లు, తీపి శీతల పానీయాలు, ఎక్కువ నూనె వంటకాలు ఎప్పుడో ఒకసారి మాత్రమే.§Chips, biscuits, sugary soft drinks and very oily food only occasionally.", "# నీరు§Water", "రోజంతా తరచుగా నీళ్లు తాగేలా అలవాటు చేయండి. ఆటల తరువాత, ఎండలో ఎక్కువ అవసరం.§Build the habit of sipping water through the day, especially after play and in hot weather.", "గమనిక: ఇది సాధారణ సూచన మాత్రమే. ప్రత్యేక ఆహార అవసరాలు, అలర్జీలు ఉంటే డాక్టర్‌ను సంప్రదించండి.§Note: this is general guidance only. For special diets or allergies, consult a doctor."]], ["🏃", "వ్యాయామం, ఆట", "Exercise and play", ["# ఎంత సమయం?§How much?", "5–17 ఏళ్ల పిల్లలకు రోజుకు సుమారు 60 నిమిషాల చురుకైన కదలిక మంచిదని ప్రపంచ ఆరోగ్య సంస్థ (WHO) సూచిస్తుంది. ఇది ఒకేసారి కాకుండా భాగాలుగా కూడా చేయవచ్చు.§The World Health Organization (WHO) suggests about 60 minutes of active movement a day for ages 5–17. It can be split into parts.", "# ఏం చేయవచ్చు?§What can they do?", "ఆరుబయట ఆటలు (కబడ్డీ, ఖో-ఖో, క్రికెట్, పరుగు), సైకిల్, తాడాట, ఈత, నడక.§Outdoor games (kabaddi, kho-kho, cricket, running), cycling, skipping, swimming, walking.", "కొన్ని సార్లు కండరాలకు బలం ఇచ్చే పనులు: గెంతడం, ఎక్కడం, సాధారణ యోగా, స్ట్రెచింగ్.§Some activities that strengthen muscles: jumping, climbing, simple yoga, stretching.", "# చిట్కాలు§Tips", "చదువు మధ్యలో 5 నిమిషాలు లేచి నడవడం లేదా స్ట్రెచ్ చేయడం ఏకాగ్రతకు సహాయపడుతుంది.§Standing up to walk or stretch for 5 minutes between study blocks helps focus.", "భోజనం చేసిన వెంటనే తీవ్రమైన ఆటలు వద్దు. ఎండలో నీళ్లు దగ్గర ఉంచండి.§Avoid hard play right after a meal. Keep water at hand in the sun.", "టీవీ, ఫోన్ స్క్రీన్ సమయాన్ని పరిమితం చేయండి, ఆట సమయాన్ని తగ్గించకండి.§Limit TV and phone screen time, and do not cut play time for it.", "గమనిక: ఆరోగ్య సమస్యలు ఉన్న పిల్లలకు వ్యాయామం గురించి డాక్టర్ సలహా తీసుకోండి.§Note: for children with health conditions, ask a doctor about exercise."]], ["👨‍👩‍👧", "తల్లిదండ్రులకు మార్గదర్శకం", "Guidance for parents", ["# ప్రేమ, ప్రోత్సాహం§Warmth and encouragement", "ప్రయత్నాన్ని మెచ్చుకోండి, మార్కులను మాత్రమే కాదు. తప్పులు నేర్చుకునే అవకాశాలు అని చెప్పండి.§Praise the effort, not only the marks. Treat mistakes as chances to learn.", "ఇతర పిల్లలతో పోల్చకండి. మీ పిల్ల నిన్నటి కంటే ఈరోజు ఎంత మెరుగైందో చూడండి.§Do not compare with other children. Look at how much your child improved since yesterday.", "# వినండి, మాట్లాడండి§Listen and talk", "రోజూ 10 నిమిషాలు పిల్లల రోజు గురించి వినండి. ఫోన్ పక్కన పెట్టి వినండి.§Spend 10 minutes daily listening about their day, with your phone put away.", "కోపంగా అరవకుండా, ప్రశాంతంగా నియమాలు చెప్పండి. నియమాలు అందరికీ ఒకేలా ఉండాలి.§Explain rules calmly instead of shouting. Keep rules consistent.", "# చదువుకు సహాయం§Supporting study", "నిశ్శబ్దమైన, వెలుతురు ఉన్న ఒకే చోటు చదువుకు కేటాయించండి. చదివే సమయంలో టీవీ ఆపండి.§Give a quiet, well-lit study corner. Switch off the TV during study time.", "పిల్లలు తామే చేసేలా ప్రోత్సహించండి. అడిగితే మాత్రమే సహాయం, సమాధానం చెప్పకుండా దారి చూపండి.§Let children do the work themselves. Help when asked, and guide rather than give answers.", "ఉపాధ్యాయులతో తరచుగా మాట్లాడండి. పిల్లలు ఏదైనా కష్టపడుతుంటే త్వరగా తెలుసుకోండి.§Talk to teachers regularly so you notice early if a child struggles.", "# పరీక్ష ఒత్తిడి§Exam stress", "పరీక్షల ముందు నిద్ర, ఆహారం, ఆట తగ్గించకండి. భయపడుతున్నారంటే ధైర్యం చెప్పండి.§Do not cut sleep, food or play before exams. Reassure a child who feels afraid.", "గమనిక: పిల్లలు చాలా రోజులు దిగులుగా ఉంటే లేదా చదువులో ఇబ్బంది ఉంటే ఉపాధ్యాయులను లేదా డాక్టర్‌ను సంప్రదించండి.§Note: if a child seems low for many days or has trouble learning, talk to a teacher or doctor."]], ["🧠", "చదువు పద్ధతులు, నిద్ర", "Study techniques and sleep", ["# యాక్టివ్ రీకాల్§Active recall", "పుస్తకం మూసి, చదివినది గుర్తు తెచ్చుకుని చెప్పండి లేదా రాయండి. మళ్లీ మళ్లీ చదవడం కంటే ఇది బాగా పనిచేస్తుంది.§Close the book and say or write what you remember. It works better than only re-reading.", "# స్పేస్డ్ రివిజన్§Spaced repetition", "ఒకసారి చదివాక 1 రోజు, 3 రోజులు, 7 రోజులు, 1 నెల తరువాత మళ్లీ చూడండి. ఇలా చేస్తే ఎక్కువకాలం గుర్తుంటుంది.§Review after 1 day, 3 days, 7 days and 1 month. This helps you remember longer.", "# పోమోడోరో విరామాలు§Pomodoro-style breaks", "చిన్న తరగతులు 15–20 నిమిషాలు, పెద్ద తరగతులు 25–45 నిమిషాలు చదివి 5–10 నిమిషాలు విరామం తీసుకోండి. విరామంలో నీళ్లు తాగండి, నడవండి, ఫోన్ చూడకండి.§Younger children study 15–20 minutes, older ones 25–45 minutes, then take a 5–10 minute break. Drink water or walk, and skip the phone.", "# మైండ్ మ్యాప్స్§Mind maps", "మధ్యలో ముఖ్య అంశం రాసి, దాని చుట్టూ శాఖలుగా ఉప అంశాలు, రంగులు, చిన్న బొమ్మలు గీయండి. సైన్స్, సోషల్ అధ్యాయాలకు బాగుంటుంది.§Write the main topic in the centre and branch out sub-topics with colours and small drawings. Good for Science and Social chapters.", "# వేగంగా చదవడం (8–10 తరగతులు)§Speed reading basics (Classes 8–10)", "ముందు శీర్షికలు, చిత్రాలు, సారాంశం చూసి అధ్యాయం ఎలా ఉందో అంచనా వేయండి.§First look at headings, pictures and the summary to preview the chapter.", "పదం పదం కాకుండా, పదాల సమూహాలను కలిపి చదవండి. పెన్ను లేదా వేలితో లైన్ వెంట నడిపిస్తే వేగం పెరుగుతుంది.§Read in groups of words rather than word by word. Guiding a pen or finger along the line can help your speed.", "వేగం కంటే అర్థం ముఖ్యం. చదివిన తరువాత 3 ముఖ్య విషయాలు గుర్తు తెచ్చుకోండి.§Understanding matters more than speed. After reading, recall 3 key points.", "# నిద్ర§Sleep", "సాధారణంగా 6–12 ఏళ్ల పిల్లలకు 9–12 గంటలు, 13–18 ఏళ్ల వారికి 8–10 గంటల నిద్ర మంచిది.§Children aged 6–12 generally do well with 9–12 hours of sleep, and teens aged 13–18 with 8–10 hours.", "రోజూ ఒకే సమయానికి పడుకోండి, లేవండి. నిద్రకు ఒక గంట ముందు స్క్రీన్లు ఆపండి.§Sleep and wake at the same time daily. Switch off screens an hour before bed.", "గమనిక: సాధారణ సూచనలు మాత్రమే. నిద్ర సమస్యలు లేదా చదువులో ప్రత్యేక అవసరాలకు డాక్టర్ లేదా ఉపాధ్యాయుల సలహా తీసుకోండి.§Note: these are general tips. For sleep problems or special learning needs, ask a doctor or teacher."]]];
