name: Preserve recordings and publish verified GK
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rollback:
        description: Restore last-good Nov6 edition using the under-cap recording package
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: pages-audio-recovery
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Verify, overlay and preserve every recording byte
        env:
          ROLLBACK: ${{ inputs.rollback || false }}
        run: |
          exec > >(tee /tmp/recovery-step.log) 2>&1
          trap 'code=$?; echo "### Recording-package diagnostic (exit $code)" >> "$GITHUB_STEP_SUMMARY"; tail -c 7000 /tmp/recovery-step.log >> "$GITHUB_STEP_SUMMARY"' EXIT
          sudo chown -R "$(id -u):$(id -g)" ./_site
          python3 - <<'PY'
          import pathlib,zipfile,hashlib,os,shutil
          root=pathlib.Path('.')
          expected={'kit':'07ae36fed47d9d3837cb1374fe984ce8602460d9ef886bf98b9b39064e39c3b9','overlay':'657ceabab2839cfd668be8d5621298d29429e159c4fe793ae5c2729ac702115c','nov9':'0ece8c1bff1a64d1c0bd291f79183c05850d04ce3254d78ab3f451024868dbe9','nov10':'31f1eec306960b685599fa0cd1f4850511836dc15b094c5b17522fe8f48e64e2','nov10schema':'847e907cad21cfb9350653b7504ac0918a81e061d00cf57bfef351133e838370','nov11':'8cac6d4c83e1a2844d6c21b16b68708b9288b84e99937a7195be53e69874a685'}
          found={}
          for p in root.glob('*.zip'):
              h=hashlib.sha256(p.read_bytes()).hexdigest()
              for key,digest in expected.items():
                  if h==digest:found[key]=p
          assert set(found)==set(expected),'Missing verified release inputs'
          with zipfile.ZipFile(found['kit']) as z:z.extractall('/tmp/akn-recovery-kit')
          site=root/'_site'
          if os.environ['ROLLBACK']!='true':
              import json
              current=json.loads((site/'gkdaily/content/latest.json').read_text())
              assert current['edition_date']<='2026-11-11','Release overlay is stale; refresh it for newer editions'
              prior={name:json.loads((site/'learn/audio'/name).read_text()) for name in ['index.json','index_m.json']}
              with zipfile.ZipFile(found['overlay']) as z:z.extractall(site)
              for name,old in prior.items():
                  merged=json.loads((site/'learn/audio'/name).read_text())
                  assert all(merged.get(k)==v for k,v in old.items()),'Overlay would remove or remap existing recording IDs'
              # Apply the reviewed next-day delta after preserving the full Nov8 release.
              prior={name:json.loads((site/'learn/audio'/name).read_text()) for name in ['index.json','index_m.json']}
              with zipfile.ZipFile(found['nov9']) as z:z.extractall(site)
              for name,old in prior.items():
                  merged=json.loads((site/'learn/audio'/name).read_text())
                  assert all(merged.get(k)==v for k,v in old.items()),'Nov9 delta would remove or remap existing recording IDs'
                  assert len(merged)==len(old)+58,'Nov9 delta must add exactly58 IDs per codec'
              current=json.loads((site/'gkdaily/content/latest.json').read_text())
              assert current['edition_date']=='2026-11-09' and 'recorded_audio_asr_qc_pass' in current['status'],'Nov9 content/audio gates not passed'
              prior={name:json.loads((site/'learn/audio'/name).read_text()) for name in ['index.json','index_m.json']}
              with zipfile.ZipFile(found['nov10']) as z:z.extractall(site)
              for name,old in prior.items():
                  merged=json.loads((site/'learn/audio'/name).read_text())
                  assert all(merged.get(k)==v for k,v in old.items()),'Nov10 would remap old IDs'
                  assert len(merged)==len(old)+58,'Nov10 must add exactly58 IDs per codec'
              with zipfile.ZipFile(found['nov10schema']) as z:z.extractall(site)
              current=json.loads((site/'gkdaily/content/latest.json').read_text())
              assert current['edition_date']=='2026-11-10' and 'recorded_audio_asr_qc_pass' in current['status'],'Nov10 gates failed'
              prior={name:json.loads((site/'learn/audio'/name).read_text()) for name in ['index.json','index_m.json']}
              with zipfile.ZipFile(found['nov11']) as z:z.extractall(site)
              for name,old in prior.items():
                  merged=json.loads((site/'learn/audio'/name).read_text())
                  assert all(merged.get(k)==v for k,v in old.items()),'Nov11 would remap old IDs'
                  assert len(merged)==len(old)+58,'Nov11 must add exactly58 IDs per codec'
              current=json.loads((site/'gkdaily/content/latest.json').read_text())
              assert current['edition_date']=='2026-11-11' and 'recorded_audio_asr_qc_pass' in current['status'],'Nov11 gates failed'
          for p in site.glob('*.zip'):p.unlink()
          if os.environ['ROLLBACK']=='true':
              shutil.copyfile('/tmp/akn-recovery-kit/rollback-latest.json',site/'gkdaily/content/latest.json')
          PY
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/akn-recovery-kit/prepare_audio.py')
          old="assert hashlib.sha256(dest.read_bytes()).hexdigest()==digest,'Remote recording bytes differ'"
          new="assert hashlib.sha256(dest.read_bytes()).hexdigest()==digest,('Remote recording bytes differ',url,digest,hashlib.sha256(dest.read_bytes()).hexdigest(),dest.stat().st_size)"
          s=p.read_text();assert old in s;p.write_text(s.replace(old,new))
          PY
          python3 /tmp/akn-recovery-kit/prepare_audio.py --site ./_site --report /tmp/audio-package-report.json
          python3 - <<'PY'
          import pathlib,json,subprocess,os
          site=pathlib.Path('_site')
          # Change URLs and worker cache together, including non-worker HTTP caches.
          page=site/'gkdaily/index.html'
          page.write_text(page.read_text().replace('app.js?v=165','app.js?v=168'))
          worker=site/'gkdaily/sw.js'
          worker.write_text(worker.read_text().replace('app.js?v=165','app.js?v=168').replace('akn-gkdaily-42-audioBinary','akn-gkdaily-49-audioBinaryNov11') if os.environ['ROLLBACK']!='true' else worker.read_text().replace('app.js?v=165','app.js?v=168').replace('akn-gkdaily-42-audioBinary','akn-gkdaily-48-audioBinaryNov10'))
          report=json.load(open('/tmp/audio-package-report.json'))
          assert report['embedded_occurrences']>=(11551 if os.environ['ROLLBACK']=='true' else 11899)
          if os.environ['ROLLBACK']=='true':
              for name,old,new in [('sw.js','4.15.200-audioBinary','4.15.201-audioBinaryRollback'),('gkdaily/sw.js','akn-gkdaily-48-audioBinaryNov10','akn-gkdaily-47-audioBinaryRollback')]:
                  p=site/name;p.write_text(p.read_text().replace(old,new))
          subprocess.run(['tar','--dereference','--hard-dereference','--directory',str(site),'-cf','/tmp/verified-pages.tar','--exclude=.git','--exclude=.github','--exclude=.[^/]*','.'],check=True)
          size=pathlib.Path('/tmp/verified-pages.tar').stat().st_size
          assert size<950000000,('Artifact exceeds 950 MB gate',size)
          print('VERIFIED_PAGES_TAR_BYTES='+str(size))
          print('VERIFIED_RECORDING_OCCURRENCES='+str(report['embedded_occurrences']))
          pathlib.Path('/tmp/build-evidence.txt').write_text('tar_bytes='+str(size)+'\nrecordings='+str(report['embedded_occurrences'])+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: recording-integrity-report
          path: |
            /tmp/audio-package-report.json
            /tmp/build-evidence.txt
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site
      - name: Verify actual uploaded Pages tar stays under 950 MB
        run: |
          actual=$(stat -c%s "$RUNNER_TEMP/artifact.tar")
          echo "ACTUAL_PAGES_ARTIFACT_TAR_BYTES=$actual"
          echo "ACTUAL_PAGES_ARTIFACT_TAR_BYTES=$actual" >> "$GITHUB_STEP_SUMMARY"
          test "$actual" -lt 950000000
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish under-cap verified artifact
        id: deployment
        uses: actions/deploy-pages@v4
