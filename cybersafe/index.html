<!DOCTYPE html>
<html lang="te"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cyber Safety / సైబర్ సేఫ్టీ</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#050b1f;color:#e8eeff;font-family:"Noto Sans Telugu","Nirmala UI","Gautami",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.55;overflow-x:hidden}
body{background:radial-gradient(900px 500px at 10% -10%,#1b2f8a55,transparent),radial-gradient(700px 500px at 100% 10%,#7a1fa255,transparent),#050b1f;min-height:100vh}
#app{max-width:560px;margin:0 auto;padding:0 12px 90px}
.top{position:sticky;top:0;z-index:5;display:flex;gap:8px;align-items:center;padding:10px 0;background:#050b1fee;backdrop-filter:blur(6px)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:10px 16px;border:0;border-radius:14px;color:#fff;font:inherit;font-weight:700;text-decoration:none;cursor:pointer;background:linear-gradient(135deg,#2f6bff,#8a3ffc);box-shadow:0 0 16px #5b7cff66}
.btn.g{background:linear-gradient(135deg,#00c98d,#00a3ff);box-shadow:0 0 16px #00d4a066}
.btn.o{background:linear-gradient(135deg,#ff9a1f,#ff3d71);box-shadow:0 0 16px #ff6b4a66}
.btn.p{background:linear-gradient(135deg,#ff3df0,#7a3dff);box-shadow:0 0 16px #c03dff66}
.btn.s{background:#ffffff14;box-shadow:none;border:1px solid #ffffff30}
.btn.sm{min-height:44px;padding:8px 12px;font-size:14px}
.sp{flex:1}
h1{font-size:22px;margin:6px 0;background:linear-gradient(90deg,#6ee7ff,#c084fc,#ff7ad9);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.35}
h2{font-size:18px;margin:18px 0 6px;color:#8fe3ff}
.en{display:block;color:#a9b8e8;font-size:.86em;line-height:1.45;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif}
.te{display:block}
body.l-te .en{display:none}body.l-en .te{display:none}body.l-en .en{color:#e8eeff;font-size:1em}
.card{background:linear-gradient(160deg,#111c4a,#0b1236);border:1px solid #3c55c455;border-radius:18px;padding:14px;margin:10px 0;box-shadow:0 0 18px #3b5bff22;overflow-wrap:anywhere}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:#ffffff0d;border:1px solid #ffffff22;border-radius:14px;padding:8px 4px;text-align:center}
.stat b{display:block;font-size:20px;color:#7dffcf}
.stat span{font-size:11px;color:#a9b8e8;display:block}
.bar{height:10px;border-radius:9px;background:#ffffff18;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#00e0a0,#33a0ff,#c04dff);box-shadow:0 0 10px #33a0ff}
.grid{display:grid;grid-template-columns:1fr;gap:10px}
.tc{display:flex;gap:12px;align-items:center;text-align:left;width:100%;min-height:72px;color:inherit;font:inherit;cursor:pointer;background:linear-gradient(160deg,#13205a,#0b1236);border:1px solid #4b66e655;border-radius:16px;padding:12px}
.tc .ic{font-size:30px;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:#ffffff14;flex:none}
.tc .tt{flex:1;min-width:0;overflow-wrap:anywhere}
.tc small{color:#7dffcf;font-weight:700}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.bd{padding:6px 10px;border-radius:20px;font-size:13px;background:#ffffff10;border:1px solid #ffffff25;opacity:.4}
.bd.on{opacity:1;background:linear-gradient(135deg,#ffb52e44,#ff3d7144);border-color:#ffb52e}
ul.l{margin:6px 0;padding:0;list-style:none}
ul.l li{padding:8px 10px;margin:6px 0;border-radius:12px;background:#ffffff0a;overflow-wrap:anywhere}
ul.ok li{border-left:4px solid #19d98b}ul.no li{border-left:4px solid #ff4d6d}
ol.l{counter-reset:s;padding:0;list-style:none}
ol.l li{counter-increment:s;position:relative;padding:10px 10px 10px 46px;margin:8px 0;border-radius:12px;background:#ffffff0a;overflow-wrap:anywhere}
ol.l li:before{content:counter(s);position:absolute;left:8px;top:10px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:linear-gradient(135deg,#2f6bff,#c04dff)}
.opt{display:block;width:100%;text-align:left;margin:8px 0;min-height:52px;padding:10px 12px;border-radius:14px;font:inherit;color:#fff;background:#ffffff10;border:1.5px solid #6f86ff66;cursor:pointer;overflow-wrap:anywhere}
.opt.right{background:#0fb87a55;border-color:#19d98b}.opt.wrong{background:#ff4d6d44;border-color:#ff4d6d}
.opt[disabled]{cursor:default}
.warn{border:1px solid #ffb52e88;background:#ffb52e14;border-radius:14px;padding:10px;margin:10px 0;font-size:14px}
a.lk{display:flex;align-items:center;min-height:48px;margin:6px 0;padding:8px 12px;border-radius:12px;background:#00a3ff22;border:1px solid #00a3ff66;color:#9fe6ff;text-decoration:none;overflow-wrap:anywhere}
.chk{display:flex;gap:10px;align-items:center;min-height:48px;padding:6px 8px;border-radius:12px;background:#ffffff0a;margin:6px 0;cursor:pointer;overflow-wrap:anywhere}
.chk input{width:26px;height:26px;flex:none;accent-color:#19d98b}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:linear-gradient(135deg,#00c98d,#2f6bff);padding:10px 18px;border-radius:24px;font-weight:800;z-index:9;box-shadow:0 0 20px #00d4a0aa;max-width:90vw;text-align:center}
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.dy{min-height:48px;border-radius:10px;border:1px solid #ffffff30;background:#ffffff0d;color:#fff;font:inherit;font-weight:700;cursor:pointer}
.dy.on{background:linear-gradient(135deg,#00e0a0,#2f6bff)}
.row{display:flex;gap:8px;flex-wrap:wrap}
</style></head><body class="l-both"><div id="app"></div>
