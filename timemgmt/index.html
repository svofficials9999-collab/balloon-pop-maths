<!doctype html><html lang="te"><head><script src="../lock.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Time Management &amp; Productivity - SV AksharaNova</title><meta name="theme-color" content="#070716"><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#070716;background-image:radial-gradient(circle at 20% 0,#2a0f5e55,transparent 50%),radial-gradient(circle at 90% 30%,#00e5ff22,transparent 45%);color:#eaf6ff;font:16px/1.5 system-ui,-apple-system,"Noto Sans Telugu","Segoe UI",sans-serif;min-height:100vh}
main{padding:12px 14px 40px;max-width:640px;margin:auto}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:8px 10px;background:#0b0b22ee;border-bottom:1px solid #00e5ff55;backdrop-filter:blur(6px)}
.tt{flex:1;font-weight:700;font-size:15px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}

h2{font-size:18px;margin:14px 0 8px;color:#fff}
.hero p{margin:0;color:#b7c8ff}
.lang{display:flex;gap:6px;justify-content:center;margin:10px 0}
.lang button{background:#14143a;color:#cfe;border:1px solid #444a99;border-radius:20px;padding:6px 12px;font-size:13px}
.lang .on{background:#00e5ff;color:#001;border-color:#00e5ff;box-shadow:0 0 12px #00e5ff}
.stat{display:flex;justify-content:space-around;font-size:14px}.bar{height:8px;background:#1b1b45;border-radius:8px;overflow:hidden;margin:6px 0 4px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#00e5ff,#ff2bd6);border-radius:8px;box-shadow:0 0 10px #ff2bd6}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{display:block;text-decoration:none;color:#fff;background:linear-gradient(160deg,#16163f,#0d0d2a);border:1px solid var(--c);border-radius:16px;padding:12px;box-shadow:0 0 14px color-mix(in srgb,var(--c) 40%,transparent);min-height:120px}
.card .ic{font-size:30px}.card .ct{font-weight:700;font-size:14px;margin:4px 0}.card .meta{font-size:11px;color:#9fb0e8}
.card.b{text-align:center}.lock{opacity:.4;filter:grayscale(1)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
.pill{display:inline-block;background:#14143a;color:#fff;text-decoration:none;border:1px solid #ff2bd6;border-radius:24px;padding:10px 14px;font-size:14px;cursor:pointer;box-shadow:0 0 10px #ff2bd655}

.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;gap:10px;align-items:center;text-decoration:none;color:#fff;background:#12123a;border:1px solid #3b3b88;border-radius:14px;padding:12px}.li.q{border-color:#ffd600}
.n{width:30px;height:30px;border-radius:50%;background:var(--c,#00e5ff);color:#001;display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}
.tip{margin-top:14px;background:#1a1a40;border-left:4px solid #7cff00;border-radius:10px;padding:10px;font-size:14px}
.lesson{background:linear-gradient(160deg,#15153d,#0c0c26);border:1px solid var(--c);border-radius:16px;padding:12px 14px;margin:10px 0;box-shadow:0 0 14px color-mix(in srgb,var(--c) 35%,transparent)}
.lesson p{margin:10px 0;padding-left:10px;border-left:3px solid var(--c)}
.lb{background:#0e2b3a;color:#7df;border:1px solid #00e5ff;border-radius:20px;padding:8px 14px;font-size:14px;margin:4px 4px 4px 0}.lb.s{background:#2a1020;color:#fab;border-color:#ff5c8a}
.nv{display:flex;justify-content:space-between;margin:14px 0}
.opts{display:flex;flex-direction:column;gap:8px}.opt{text-align:left;background:#12123a;color:#fff;border:1px solid #4a4aa8;border-radius:14px;padding:12px;font-size:15px}
.opt.ok{background:#0b3d1c;border-color:#7cff00}.opt.no{background:#4a1020;border-color:#ff5252}
.fb{margin:12px 0;padding:10px;border-radius:12px}.fb.g{background:#0b3d1c}.fb.b{background:#3d1a0b}
.qh{color:#ffd600;font-weight:700}.res{text-align:center;padding:20px 0}.ok{color:#7cff00;text-align:center;font-weight:700}
.dg{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:12px 0}.dot{aspect-ratio:1;border-radius:10px;background:#14143a;border:1px solid #3b3b88;display:flex;align-items:center;justify-content:center;font-size:13px}.dot.on{background:#ff6d00;color:#001;font-weight:800;box-shadow:0 0 10px #ff6d00}.dot.cur{border-color:#00e5ff;box-shadow:0 0 10px #00e5ff}
.center{text-align:center;margin:8px 0}.clk{font:800 54px/1.2 ui-monospace,monospace;text-align:center;color:#ffb300;text-shadow:0 0 16px #ffb300}
.inp{width:100%;margin:5px 0;padding:10px;border-radius:12px;border:1px solid #7cff00;background:#0c0c26;color:#fff;font-size:15px}
.disc{font-size:12px;color:#8fa0d8;margin:14px 0}.src{padding-left:20px;font-size:13px}.src li{margin:12px 0}.src a{color:#00e5ff;word-break:break-all}.src em{color:#9fb0e8}
#toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,40px);background:#ff2bd6;color:#fff;padding:10px 16px;border-radius:20px;opacity:0;transition:.3s;z-index:9;max-width:90%;font-size:14px;text-align:center}#toast.show{opacity:1;transform:translate(-50%,0)}
.stat .bi,.stat .bi span,.meta .bi,.meta .bi span{display:inline}.stat .te+.en,.meta .te+.en{display:none}
